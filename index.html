<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyHomePage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="assets/Gbt.mp4?v=1" type="video/mp4">
        Your browser cannot load HTML video—it’s extremely outdated!
    </video>
    <div class="video-overlay" aria-hidden="true"></div>
    <audio id="background-audio" loop>
        <source src="assets/Gbt.mp3" type="audio/mpeg">
    </audio>

    <main class="content">
        <section class="hero-copy">
            <h1 class="text-h1">Hi, Welcome to my Homepage</h1>
            <p class="text-normal">what you looking for?</p>
            <nav class="social-links" aria-label="Social media">
                <a href="https://www.tiktok.com/@fraddricc" target="_blank" rel="noopener noreferrer" aria-label="TikTok @fraddricc">
                    <img class="social-icon-dark" src="assets/Icons/tik-tok.png" alt="">
                </a>
                <a href="https://discord.com/users/ur.ryx" target="_blank" rel="noopener noreferrer" aria-label="Discord invite">
                    <img src="assets/Icons/discord.png" alt="">
                </a>
                <a href="https://x.com/-" target="_blank" rel="noopener noreferrer" aria-label="X @-">
                    <img class="social-icon-dark" src="assets/Icons/x.png" alt="">
                </a>
                <a href="https://github.com/-" target="_blank" rel="noopener noreferrer" aria-label="GitHub @-">
                    <img class="social-icon-dark" src="assets/Icons/github.png" alt="">
                </a>
            </nav>
        </section>
        <div class="audio-controls" role="group" aria-label="Kontrol audio">
            <span class="audio-status" id="audio-status" role="status" aria-live="polite"></span>
            <button class="audio-toggle" id="audio-toggle" type="button" aria-label="Putar audio">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path id="audio-icon" d="M8 5v14l11-7z"></path>
                </svg>
            </button>
            <label for="volume-control">Volume</label>
            <input
                class="volume-control"
                id="volume-control"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.03"
                aria-label="Atur volume audio"
            >
        </div>
    </main>

    <script>
        const audio = document.getElementById('background-audio');
        const audioToggle = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');
        const volumeControl = document.getElementById('volume-control');
        const audioStatus = document.getElementById('audio-status');

        audio.volume = Number(volumeControl.value);

        function updateAudioButton(isPlaying) {
            audioIcon.setAttribute(
                'd',
                isPlaying ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z'
            );
            audioToggle.setAttribute('aria-label', isPlaying ? 'Jeda audio' : 'Putar audio');
        }

        audioToggle.addEventListener('click', async () => {
            audioStatus.textContent = '';

            if (audio.paused) {
                await audio.play();
                updateAudioButton(true);
                
            } else {
                audio.pause();
                updateAudioButton(false);
            }
        });

        audio.addEventListener('play', () => updateAudioButton(true));
        audio.addEventListener('pause', () => updateAudioButton(false));
        volumeControl.addEventListener('input', () => {
            audio.volume = Number(volumeControl.value);
        });
    </script>
</body>
</html>
